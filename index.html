<html>
<head>
  <title>Eckheart</title>
  <style>
    @keyframes wobble {
      from {
        transform: rotateZ(0deg);
      }
      20% {
        transform: rotateZ(-10deg) translateX(-5%) translateY(5%);
      }
      40% {
        transform: rotateZ(-20deg) translateX(-10%) translateY(-5%);
      }
      60% {
        transform: rotateZ(10deg) translateX(5%) translateY(5%);
      }
      80% {
        transform: rotateZ(20deg) translateX(10%) translateY(-5%);
      }
      100% {
        transform: rotateZ(0deg);
      }
    }

		.reveal-text {
			display: inline-block;
			color: #1a1a1a;

			-webkit-mask-image:
				linear-gradient(to right, black, transparent),
				linear-gradient(to left, black, transparent);
			mask-image:
				linear-gradient(to right, black 80%, transparent),
				linear-gradient(to left, black 80%, transparent);

			-webkit-mask-repeat: no-repeat, no-repeat;
			mask-repeat: no-repeat, no-repeat;

			-webkit-mask-position: left, right;
			mask-position: left, right;

			-webkit-mask-size: 0% 100%, 0% 100%;
			mask-size: 0% 100%, 0% 100%;

			animation: reveal-both-ends 1.4s ease-out forwards;
		}

		@keyframes reveal-both-ends {
			0% {
				-webkit-mask-size: 0% 100%, 0% 100%;
				mask-size: 0% 100%, 0% 100%;
			}
			100% {
				-webkit-mask-size: 55% 100%, 55% 100%;
				mask-size: 55% 100%, 55% 100%;
			}
		}


    #logo {
      will-change: transform;
      animation-name: wobble;
      animation-duration: 0.4s;
      animation-iteration-count: 3;
      animation-fill-mode: backwards;
      display: block;
      margin: auto;
      width: 50%;
    }

    .site {
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>
  <img id="logo" src="eckheart_logo.png"/>
  <div>
    <a class="reveal-text site" href="https://github.com/fozzbuzz">https://github.com/fozzbuzz</a>
  </div>
</body
</html>
